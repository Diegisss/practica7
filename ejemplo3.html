<!DOCTYPE html>
<html lang="es-mx">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica7: elemetosJS parte 1</title>
    <!--ENLACES A FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
        integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />
    <style>
        body {
            background-color: white;
            color: white;

            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
        }

        button {
            width: 80px;
            height: 40px;
        }
    </style>
    <script defer>
        function dibujar() {
            var canvas = document.getElementById('hojaPapel');
            var lapiz = canvas.getContext('2d');
            var imageObj = new Image();
            imageObj.src = 'images/vivalavida.jpg';
            // Draw image
            imageObj.onload = function () {
                lapiz.drawImage(imageObj, 0, 250);
            }
            lapiz.font = '14pt Calibri';

            lapiz.fillText('Hi. en Canvas 2d!', 20, 30);

            lapiz.strokeStyle = '#00ff00';

            lapiz.lineWidth = 3;

            lapiz.beginPath();
            lapiz.rect(50, 50, 160, 160);
            lapiz.moveTo(130, 50);
            lapiz.lineTo(130, 210);
            lapiz.moveTo(50, 130);
            lapiz.lineTo(210, 130);
            lapiz.stroke();

            //Triangulos del primer cuadrante:
            //Triangulos de color negro
            lapiz.fillStyle = 'black';
            //triangulo A
            lapiz.beginPath();
            lapiz.moveTo(50, 50);
            lapiz.lineTo(130, 50);
            lapiz.lineTo(110, 70);
            lapiz.lineTo(50, 50);
            lapiz.fill();
            lapiz.fillStyle='blue';
            //triangulo B
            lapiz.beginPath();
            lapiz.moveTo(130, 50);
            lapiz.lineTo(110, 70);
            lapiz.lineTo(130, 130);
            lapiz.lineTo(130, 50);
            lapiz.fill();
            //Triangulos del color gris
            lapiz.fillStyle = 'black';
            //triangulo C
            lapiz.beginPath();
            lapiz.moveTo(50, 50);
            lapiz.lineTo(70, 110);
            lapiz.lineTo(50, 130);
            lapiz.lineTo(50, 50);
            lapiz.fill();

            lapiz.fillStyle='red';
            //triangulo D
            lapiz.beginPath();
            lapiz.moveTo(50, 130);
            lapiz.lineTo(70, 110);
            lapiz.lineTo(130, 130);
            lapiz.lineTo(50, 130);
            lapiz.fill();
            //repetir para los 3 cuadrantes restantes

            /*cuadrante 2*/
            lapiz.fillStyle='black'
            lapiz.beginPath();
            lapiz.moveTo(210,50);
            lapiz.lineTo(132, 50);
            lapiz.lineTo(152, 70);  
            lapiz.fill();

            lapiz.fillStyle='red'
            lapiz.beginPath();
            lapiz.moveTo(132,50);
            lapiz.lineTo(152, 70);
            lapiz.lineTo(132, 132);
            lapiz.fill();

            lapiz.fillStyle='blue'
            lapiz.beginPath();
            lapiz.moveTo(210,130);
            lapiz.lineTo(188,110);
            lapiz.lineTo(130,130);
            lapiz.fill();

            lapiz.fillStyle='black';
            lapiz.beginPath();
            lapiz.moveTo(210,50);
            lapiz.lineTo(188,110);
            lapiz.lineTo(210,130);
            lapiz.fill();

            /*cuadrante 3*/

            lapiz.fillStyle='blue';
            
            lapiz.beginPath();
            lapiz.moveTo(132,132);
            lapiz.lineTo(70,150);
            lapiz.lineTo(50,132);
            lapiz.fill();

            lapiz.fillStyle='black';
            lapiz.beginPath();
            lapiz.moveTo(50,210);
            lapiz.lineTo(70, 150);
            lapiz.lineTo(50,132);
            lapiz.fill();

            lapiz.beginPath();
            lapiz.moveTo(130,210);
            lapiz.lineTo(110,188);
            lapiz.lineTo(50,210);
            lapiz.fill();

            lapiz.fillStyle='red';
            lapiz.beginPath();
            lapiz.moveTo(130,210);
            lapiz.lineTo(110,188);
            lapiz.lineTo(130, 132);
            lapiz.fill();

            /*cuadrante 4*/

            lapiz.fillStyle='blue';
            lapiz.beginPath();
            lapiz.moveTo(132,132);
            lapiz.lineTo(152,188);
            lapiz.lineTo(130,210);
            lapiz.fill();


            lapiz.fillStyle='black';
            lapiz.beginPath();
            lapiz.moveTo(130,210);
            lapiz.lineTo(152,188);
            lapiz.lineTo(210,210);
            lapiz.fill();
            
            lapiz.fillStyle='red';
            lapiz.beginPath();
            lapiz.moveTo(210,132);
            lapiz.lineTo(188,152);
            lapiz.lineTo(130,132);
            lapiz.fill();

            lapiz.fillStyle='black';
            lapiz.beginPath();
            lapiz.moveTo(210,210);
            lapiz.lineTo(188,152);
            lapiz.lineTo(210,132);
            lapiz.fill();
            
            //dibujo de un payaso usando figura geometricas

             // 1. Cabello esponjado de payaso (círculos a los lados)
            lapiz.fillStyle = 'gray';
            lapiz.strokeStyle = 'black';
            lapiz.lineWidth = 2;

            /*cara redonda*/
            lapiz.beginPath();
            lapiz.arc(500, 220, 75, 0, Math.PI*2);
            lapiz.fill();

            /*nariz*/
            lapiz.fillStyle='red';
            lapiz.beginPath();
            lapiz.arc(500, 223, 21, 0, Math.PI * 2);
            lapiz.fill();

            

            /*boca*/
            lapiz.lineCap = 'round'
            lapiz.beginPath();
            lapiz.arc(500, 236, 42, 0.25, Math.PI-0.25);
            lapiz.fill();

            /*parte de adentro de la boca*/
            lapiz.fillStyle='black';
            lapiz.beginPath();
            lapiz.arc(500, 240, 35, 0.28, Math.PI - 0.28);
            lapiz.fill();

            /*ojos*/
            lapiz.beginPath();
            lapiz.ellipse(470,190, 7, 10,0, 0, Math.PI*2);
            lapiz.ellipse(530,190, 7, 10,0, 0, Math.PI*2);
            lapiz.fill();

            /*pupila*/
            lapiz.fillStyle='white';
            lapiz.beginPath();
            lapiz.arc(468, 185, 3.5, 0, Math.PI*2);
            lapiz.arc(528, 185, 3.5, 0, Math.PI*2);
            lapiz.fill();

            /*pomulos*/
            lapiz.fillStyle = 'rgba(255, 100, 100, 0.35)'
            lapiz.beginPath();
            lapiz.ellipse(455, 228, 22, 12, 0, 0, Math.PI * 2);
            lapiz.ellipse(545, 228, 22, 12, 0, 0, Math.PI * 2);
            lapiz.fill();


        }
    </script>
</head>

<body onload="dibujar()">
    <canvas id="hojaPapel" width="1200" height="800" style="border:1px solid #000000;"></canvas>
</body>

</html>

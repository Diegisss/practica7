<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos de jquery: Añadir y quitar clases CSS a elementos</title>

    <script src="js/jquery-4.0.0.min.js" type="text/javascript"></script>
    <style type="text/css">
        .clasecss {
            background-color: #ff8800;
            font-weight: bold;
        }
    </style>
    <script>
        $(document).ready(function () {
            $("a").mouseover(function (event) {
                $("#capa").addClass("clasecss");
            });
            $("a").mouseout(function (event) {
                $("#capa").removeClass("clasecss");
            });
        });
    </script>
</head>

<body>
    <div id="capa">
        Esta capa es independiente y voy a añadir y eliminar clases css sobre ella
    </div>
    <br>
    <br>
    <a href="http://localhost/~scomp/practica7/index.html">Añadir y quitar clase en la capa de arriba</a>
</body>

</html>
